github:
  trending_limit: 5
  active_limit: 5

blogs:
  lookback_days: 3
  max_articles: 10
  sources:
  - name: OpenAI
    type: rss
    url: https://openai.com/blog/rss.xml
  - name: Anthropic
    type: scrape
    url: https://www.anthropic.com/research
    selector: "a[href^='/research/']"
  - name: Google DeepMind
    type: rss
    url: https://deepmind.google/blog/rss.xml
  - name: Meta AI
    type: rss
    url: https://ai.meta.com/blog/rss/
  - name: Hugging Face
    type: rss
    url: https://huggingface.co/blog/feed.xml

arxiv:
  categories: [cs.AI, cs.CL]
  max_results: 5
  keywords: [llm, agent, rag, agentic, mcp, language model, transformer, harness]

email:
  smtp_host: smtp.163.com
  smtp_port: 465
